name: Desktop packages

on:
  workflow_call:
    inputs:
      installers:
        type: boolean
        default: false
    secrets:
      WIN_CSC_LINK:
        required: false
      WIN_CSC_KEY_PASSWORD:
        required: false
      MAC_CSC_LINK:
        required: false
      MAC_CSC_KEY_PASSWORD:
        required: false
      APPLE_ID:
        required: false
      APPLE_APP_SPECIFIC_PASSWORD:
        required: false
      APPLE_TEAM_ID:
        required: false

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            arch: x64
          - os: ubuntu-latest
            platform: linux
            arch: x64
          - os: macos-15-intel
            platform: mac
            arch: x64
          - os: macos-latest
            platform: mac
            arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm build:desktop
      # electron-builder 的 macOS 分支会把空的 CSC_LINK 当成相对路径去读文件（builder-util 的 loadCscLink），
      # 报 "<项目目录> not a file"；Windows 分支有 `cscLink === ""` 保护，macOS 分支只判 null。
      # 因此凭据只在真的存在时才导出，未配置时让 electron-builder 走「跳过签名/公证」的正路。
      - name: Export signing credentials
        shell: bash
        env:
          SIGN_CSC_LINK: ${{ matrix.platform == 'mac' && secrets.MAC_CSC_LINK || matrix.platform == 'win' && secrets.WIN_CSC_LINK || '' }}
          SIGN_CSC_KEY_PASSWORD: ${{ matrix.platform == 'mac' && secrets.MAC_CSC_KEY_PASSWORD || matrix.platform == 'win' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
          SIGN_APPLE_ID: ${{ matrix.platform == 'mac' && secrets.APPLE_ID || '' }}
          SIGN_APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.platform == 'mac' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          SIGN_APPLE_TEAM_ID: ${{ matrix.platform == 'mac' && secrets.APPLE_TEAM_ID || '' }}
        run: |
          # CSC_LINK 需为单行 base64（如 openssl base64 -A 的输出）或 data: URI。
          if [ -n "$SIGN_CSC_LINK" ]; then
            printf 'CSC_LINK=%s\n' "$SIGN_CSC_LINK" >> "$GITHUB_ENV"
            printf 'CSC_KEY_PASSWORD=%s\n' "$SIGN_CSC_KEY_PASSWORD" >> "$GITHUB_ENV"
          fi
          if [ -n "$SIGN_APPLE_ID" ] && [ -n "$SIGN_APPLE_APP_SPECIFIC_PASSWORD" ]; then
            printf 'APPLE_ID=%s\n' "$SIGN_APPLE_ID" >> "$GITHUB_ENV"
            printf 'APPLE_APP_SPECIFIC_PASSWORD=%s\n' "$SIGN_APPLE_APP_SPECIFIC_PASSWORD" >> "$GITHUB_ENV"
            printf 'APPLE_TEAM_ID=%s\n' "$SIGN_APPLE_TEAM_ID" >> "$GITHUB_ENV"
          fi
      - name: Package application
        working-directory: apps/desktop
        shell: bash
        env:
          TARGET_PLATFORM: ${{ matrix.platform }}
          TARGET_ARCH: ${{ matrix.arch }}
          BUILD_INSTALLERS: ${{ inputs.installers }}
        run: |
          args=(--config electron-builder.yml --publish never "--$TARGET_PLATFORM" "--$TARGET_ARCH")
          if [ "$BUILD_INSTALLERS" != 'true' ]; then args+=(--dir); fi
          pnpm exec electron-builder "${args[@]}"
      - name: Upload installers
        if: inputs.installers
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installers-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
          if-no-files-found: error
          retention-days: 14
