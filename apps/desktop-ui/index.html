<!doctype html>
<!-- 主题类必须静态写在这里：CSP 禁内联脚本，抢不到首帧之前的执行时机。
     取值须与应用设置里的默认主题一致，否则每次冷启动都会先画一帧再跳色。 -->
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' http://localhost:* ws://localhost:*; object-src 'none'; base-uri 'self'; form-action 'none'"
    />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chaptale</title>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
