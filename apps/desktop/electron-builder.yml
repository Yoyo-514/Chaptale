appId: com.chaptale.desktop
productName: Chaptale
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
copyright: Copyright © 2026 yoyo514

asar: true
asarUnpack:
  - '**/node_modules/@earendil-works/pi-codemode/**'
  - '**/node_modules/quickjs-wasi/**'
afterPack: ./scripts/after-pack.cjs

extraResources:
  - from: ../../LICENCE
    to: LICENCE
  - from: ../../NOTICE
    to: NOTICE

files:
  - dist/**
  - package.json
  - resources/favicon.ico

directories:
  buildResources: resources
  output: release

win:
  icon: resources/favicon.ico
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: Chaptale
  uninstallDisplayName: Chaptale

mac:
  icon: resources/icon.icns
  category: public.app-category.productivity
  # 架构由打包命令指定，CI 每个 runner 只构建对应架构。
  target:
    - dmg
    - zip

linux:
  executableName: chaptale
  icon: resources/icons
  category: Office
  maintainer: yoyo514
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
