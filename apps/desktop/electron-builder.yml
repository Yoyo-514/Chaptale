appId: com.chaptale.desktop
productName: Chaptale
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
copyright: Copyright © 2026 yoyo514

asar: true
afterPack: ./scripts/after-pack.cjs

extraResources:
  - from: ../../LICENCE
    to: LICENCE
  - from: ../../NOTICE
    to: NOTICE

files:
  - dist/**
  - package.json
  - resources/favicon.ico

directories:
  buildResources: resources
  output: release

win:
  icon: resources/favicon.ico
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: Chaptale
  uninstallDisplayName: Chaptale

mac:
  icon: resources/icon.icns
  category: public.app-category.productivity
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64

linux:
  icon: resources/icons
  category: Office
  maintainer: yoyo514
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
