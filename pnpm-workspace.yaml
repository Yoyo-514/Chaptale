  '@codemirror/view': 6.43.14
  '@lezer/highlight': ^1.2.5
  '@mozilla/readability': ^0.6.0
  linkedom: ^0.18.13
  turndown: ^7.2.4
  '@iconify-json/mingcute': ^1.2.8
  '@node-rs/jieba': ^2.0.4
  '@types/node': ^26.6.5
  '@types/turndown': ^5.0.6
  atomically: ^2.1.1
  '@playwright/test': ^1.64.1
