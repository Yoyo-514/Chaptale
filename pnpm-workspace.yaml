packages:
  - apps/*
  - packages/*

minimumReleaseAge: 0

allowBuilds:
  '@google/genai': true
  '@parcel/watcher': true
  better-sqlite3: true
  electron: true
  electron-winstaller: true
  esbuild: true
  protobufjs: true
