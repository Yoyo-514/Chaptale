  vue: ^3.5.44
  vue-tsc: ^3.3.13
  officeparser: ^8.1.1
  yaml: ^2.9.1
  chokidar: 5.0.0
  # 归档打包/解包：桌面端首选纯 JS（无原生模块、无需为三平台各备预编译产物）。
  fflate: ^0.8.3
  '@codemirror/merge': 6.12.2

