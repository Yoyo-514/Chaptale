packages:
  - apps/*
  - packages/*

allowBuilds:
  "@google/genai": true
  "@parcel/watcher": true
  electron: true
  electron-winstaller: true
  esbuild: true
  protobufjs: true
  # OCR 永久禁用；显式阻止其安装脚本，避免 pnpm 将未审批脚本视为配置错误。
  tesseract.js: false
  vue-demi: true

catalog:
  "@capacitor/cli": ^8.4.1
  "@capacitor/core": ^8.4.1
  "@ai-sdk/anthropic": ^4.0.39
  "@ai-sdk/google": ^4.0.44
  "@ai-sdk/openai": ^4.0.42
  "@ai-sdk/openai-compatible": ^3.0.30
  "ai": ^7.0.66
  "@mozilla/readability": ^0.6.0
  linkedom: ^0.18.13
  turndown: ^7.2.4
  "@iconify-json/mingcute": ^1.2.8
  "@node-rs/jieba": ^2.0.2
  "@types/node": ^26.2.0
  "@types/turndown": ^5.0.6
  atomically: ^2.1.1
  "@playwright/test": ^1.62.1
  "@vitest/coverage-v8": ^4.1.10
  "@vue/test-utils": ^2.4.11
  "@unocss/preset-icons": ^66.7.5
  "@unocss/reset": ^66.7.5
