packages:
  - apps/*
  - packages/*

allowBuilds:
  '@google/genai': true
  '@parcel/watcher': true
  electron: true
  electron-winstaller: true
  esbuild: true
  protobufjs: true
  # OCR 永久禁用；显式阻止其安装脚本，避免 pnpm 将未审批脚本视为配置错误。
  tesseract.js: false
  vue-demi: true

