  bumpp: ^12.3.0
  clsx: ^2.1.1
  cross-env: ^10.1.0
  electron: ^44.8.0
  '@electron/fuses': ^2.1.3
  electron-builder: ^26.17.0
  vite-plugin-electron: ^1.1.2
  happy-dom: ^21.0.3
  husky: ^9.1.7
  lint-staged: ^17.6.0
  klona: ^2.0.6
  marked: ^18.1.1
  npm-run-all: ^4.1.5
  pinyin-pro: ^3.29.5
  oxfmt: ^0.73.0
  oxlint: ^1.88.0
  reka-ui: ^2.11.0
  sass: ^1.105.2
  turbo: ^2.11.9
  typebox: ^1.4.2
  typescript: ^6.0.3
  unocss: ^66.11.0
  pinia: ^4.1.0
  vite: ^8.3.4
