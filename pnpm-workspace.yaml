  "@tanstack/vue-virtual": ^3.13.35
  clsx: ^2.1.1
  cross-env: ^10.1.0
  electron: ^43.4.0
  electron-builder: ^26.15.7
  vite-plugin-electron: ^1.1.1
  happy-dom: ^20.11.2
  husky: ^9.1.7
  lint-staged: ^17.3.0
  klona: ^2.0.6
  marked: ^18.0.9
  minisearch: ^7.2.0
  npm-run-all: ^4.1.5
  pinyin-pro: ^3.29.1
  oxfmt: ^0.63.0
  oxlint: ^1.78.0
  radash: ^12.1.1
  reka-ui: ^2.10.3
  sass: ^1.102.0
  turbo: ^2.10.10
  typebox: ^1.3.14
  typescript: ^6.0.3
